spring.datasource.url=jdbc:h2:mem:nightout;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.sql.init.mode=never
spring.batch.jdbc.initialize-schema=never
spring.session.jdbc.initialize-schema=never
nightout.seed-demo=false
nightout.storage-provider=local
nightout.local-storage-path=${java.io.tmpdir}/nightout-test-storage
nightout.retention-days=7
nightout.image-optimization.enabled=false
spring.security.oauth2.client.provider.logto.authorization-uri=https://auth.primepick.co.za/oidc/auth
spring.security.oauth2.client.provider.logto.token-uri=https://auth.primepick.co.za/oidc/token
spring.security.oauth2.client.provider.logto.jwk-set-uri=https://auth.primepick.co.za/oidc/jwks
spring.security.oauth2.client.provider.logto.user-info-uri=https://auth.primepick.co.za/oidc/me
spring.security.oauth2.client.provider.logto.user-name-attribute=sub
spring.security.oauth2.client.registration.logto.provider=logto
spring.security.oauth2.client.registration.logto.client-id=test-client
spring.security.oauth2.client.registration.logto.client-secret=test-secret
spring.security.oauth2.client.registration.logto.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.logto.scope=openid,profile,email,roles
spring.security.oauth2.client.registration.logto.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
