spring.application.name=Nightout
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8090}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.batch.jdbc.initialize-schema=${SPRING_BATCH_JDBC_INITIALIZE_SCHEMA:never}
spring.session.jdbc.initialize-schema=${SPRING_SESSION_JDBC_INITIALIZE_SCHEMA:never}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.schemas=${SPRING_FLYWAY_SCHEMAS:public}

spring.servlet.multipart.max-file-size=${NIGHTOUT_MAX_UPLOAD_BYTES:26214400}
spring.servlet.multipart.max-request-size=${NIGHTOUT_MAX_REQUEST_BYTES:314572800}

nightout.base-url=${NIGHTOUT_BASE_URL:http://localhost:8090}
nightout.time-zone=${NIGHTOUT_TIME_ZONE:Africa/Johannesburg}
nightout.retention-days=${NIGHTOUT_RETENTION_DAYS:7}
nightout.max-upload-bytes=${NIGHTOUT_MAX_UPLOAD_BYTES:26214400}
nightout.max-request-bytes=${NIGHTOUT_MAX_REQUEST_BYTES:314572800}
nightout.max-upload-count=${NIGHTOUT_MAX_UPLOAD_COUNT:12}
nightout.image-optimization.enabled=${NIGHTOUT_IMAGE_OPTIMIZATION_ENABLED:true}
nightout.image-optimization.max-dimension=${NIGHTOUT_IMAGE_OPTIMIZATION_MAX_DIMENSION:1080}
nightout.image-optimization.jpeg-quality=${NIGHTOUT_IMAGE_OPTIMIZATION_JPEG_QUALITY:0.82}
nightout.image-optimization.delete-original=${NIGHTOUT_IMAGE_OPTIMIZATION_DELETE_ORIGINAL:true}
nightout.image-optimization.batch-size=${NIGHTOUT_IMAGE_OPTIMIZATION_BATCH_SIZE:10}
nightout.storage-provider=${NIGHTOUT_STORAGE_PROVIDER:local}
nightout.local-storage-path=${NIGHTOUT_LOCAL_STORAGE_PATH:./storage/nightout}
nightout.seed-demo=${NIGHTOUT_SEED_DEMO:true}
nightout.seed-admin-email=${NIGHTOUT_SEED_ADMIN_EMAIL:admin@nightout.local}
nightout.seed-club-owner-email=${NIGHTOUT_SEED_CLUB_OWNER_EMAIL:owner@nightout.local}
nightout.schema-version=${NIGHTOUT_SCHEMA_VERSION:1}
nightout.schema-reset-allowed=${NIGHTOUT_SCHEMA_RESET_ALLOWED:false}

nightout.s3.endpoint=${NIGHTOUT_S3_ENDPOINT:http://127.0.0.1:8080}
nightout.s3.bucket=${NIGHTOUT_S3_BUCKET:nightout}
nightout.s3.region=${NIGHTOUT_S3_REGION:us-east-1}
nightout.s3.access-key=${NIGHTOUT_S3_ACCESS_KEY:}
nightout.s3.secret-key=${NIGHTOUT_S3_SECRET_KEY:}
nightout.s3.path-style=${NIGHTOUT_S3_PATH_STYLE:true}

spring.security.oauth2.client.provider.logto.issuer-uri=${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_LOGTO_ISSUER_URI:}
spring.security.oauth2.client.registration.logto.client-name=Logto
spring.security.oauth2.client.registration.logto.provider=logto
spring.security.oauth2.client.registration.logto.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.logto.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_LOGTO_CLIENT_ID:}
spring.security.oauth2.client.registration.logto.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_LOGTO_CLIENT_SECRET:}
spring.security.oauth2.client.registration.logto.scope=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_LOGTO_SCOPE:openid,profile,email,role}
spring.security.oauth2.client.registration.logto.redirect-uri=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_LOGTO_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
