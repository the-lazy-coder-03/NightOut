spring.application.name=Nightout
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8090}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.batch.jdbc.initialize-schema=${SPRING_BATCH_JDBC_INITIALIZE_SCHEMA:never}
spring.session.jdbc.initialize-schema=${SPRING_SESSION_JDBC_INITIALIZE_SCHEMA:never}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.schemas=${SPRING_FLYWAY_SCHEMAS:public}

spring.servlet.multipart.max-file-size=${NIGHTOUT_MAX_UPLOAD_BYTES:26214400}
spring.servlet.multipart.max-request-size=${NIGHTOUT_MAX_REQUEST_BYTES:314572800}

nightout.base-url=${NIGHTOUT_BASE_URL:http://localhost:8090}
nightout.time-zone=${NIGHTOUT_TIME_ZONE:Africa/Johannesburg}
nightout.retention-days=${NIGHTOUT_RETENTION_DAYS:7}
nightout.max-upload-bytes=${NIGHTOUT_MAX_UPLOAD_BYTES:26214400}
nightout.max-upload-count=${NIGHTOUT_MAX_UPLOAD_COUNT:12}
nightout.storage-provider=${NIGHTOUT_STORAGE_PROVIDER:local}
nightout.local-storage-path=${NIGHTOUT_LOCAL_STORAGE_PATH:./storage/nightout}
nightout.seed-demo=${NIGHTOUT_SEED_DEMO:true}
nightout.admin-login-email=${NIGHTOUT_ADMIN_LOGIN_EMAIL:admin@nightout.local}
nightout.admin-login-password=${NIGHTOUT_ADMIN_LOGIN_PASSWORD:admin12345}
nightout.club-login-email=${NIGHTOUT_CLUB_LOGIN_EMAIL:owner@nightout.local}
nightout.club-login-password=${NIGHTOUT_CLUB_LOGIN_PASSWORD:owner12345}
nightout.schema-version=${NIGHTOUT_SCHEMA_VERSION:1}
nightout.schema-reset-allowed=${NIGHTOUT_SCHEMA_RESET_ALLOWED:false}

nightout.s3.endpoint=${NIGHTOUT_S3_ENDPOINT:http://127.0.0.1:8080}
nightout.s3.bucket=${NIGHTOUT_S3_BUCKET:nightout}
nightout.s3.region=${NIGHTOUT_S3_REGION:us-east-1}
nightout.s3.access-key=${NIGHTOUT_S3_ACCESS_KEY:}
nightout.s3.secret-key=${NIGHTOUT_S3_SECRET_KEY:}
nightout.s3.path-style=${NIGHTOUT_S3_PATH_STYLE:true}
