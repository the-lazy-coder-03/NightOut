spring.application.name=Nightout
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.batch.jdbc.initialize-schema=${SPRING_BATCH_JDBC_INITIALIZE_SCHEMA:never}
spring.session.jdbc.initialize-schema=${SPRING_SESSION_JDBC_INITIALIZE_SCHEMA:never}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.schemas=${SPRING_FLYWAY_SCHEMAS:public}

spring.servlet.multipart.max-file-size=${NIGHTOUT_MAX_UPLOAD_BYTES:10485760}
spring.servlet.multipart.max-request-size=${NIGHTOUT_MAX_REQUEST_BYTES:52428800}

nightout.base-url=${NIGHTOUT_BASE_URL:http://localhost:8080}
nightout.time-zone=${NIGHTOUT_TIME_ZONE:Africa/Johannesburg}
nightout.retention-days=${NIGHTOUT_RETENTION_DAYS:7}
nightout.max-upload-bytes=${NIGHTOUT_MAX_UPLOAD_BYTES:10485760}
nightout.max-upload-count=${NIGHTOUT_MAX_UPLOAD_COUNT:12}
nightout.storage-provider=${NIGHTOUT_STORAGE_PROVIDER:local}
nightout.local-storage-path=${NIGHTOUT_LOCAL_STORAGE_PATH:./storage/nightout}
nightout.seed-demo=${NIGHTOUT_SEED_DEMO:true}
nightout.schema-version=${NIGHTOUT_SCHEMA_VERSION:1}
nightout.schema-reset-allowed=${NIGHTOUT_SCHEMA_RESET_ALLOWED:false}

nightout.nine-drive.base-url=${NIGHTOUT_9DRIVE_BASE_URL:http://localhost:4000}
nightout.nine-drive.api-key=${NIGHTOUT_9DRIVE_API_KEY:}
nightout.nine-drive.email=${NIGHTOUT_9DRIVE_EMAIL:}
nightout.nine-drive.password=${NIGHTOUT_9DRIVE_PASSWORD:}
nightout.nine-drive.folder-id=${NIGHTOUT_9DRIVE_FOLDER_ID:}
