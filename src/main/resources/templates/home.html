<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NightOut</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="home-page">
<header class="home-nav">
    <a class="home-brand" href="/">NightOut</a>
    <a class="home-login" href="/login">Club login</a>
</header>
<main class="home-shell">
    <section class="home-hero">
        <span class="home-kicker">NightOut South Africa</span>
        <h1>Find the nightlife photos from your area, all in one place</h1>
        <nav aria-label="Areas">
            <ul class="area-list">
                <li th:each="area : ${areas}">
                    <a class="area-link" th:href="@{/areas/{slug}(slug=${area.slug})}">
                        <span th:text="${area.displayName}">Cape Town</span>
                    </a>
                </li>
            </ul>
        </nav>
    </section>
</main>
</body>
</html>
