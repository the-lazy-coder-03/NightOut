<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NightOut</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">NightOut</a>
    <nav class="nav">
        <a href="/login">Club login</a>
    </nav>
</header>
<main class="shell">
    <section class="hero">
        <span class="eyebrow">Cape Town nights</span>
        <h1>Find your night</h1>
        <p>Choose a venue, choose the night, then view or upload the photos from that event.</p>
        <div class="photo-strip" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    </section>

    <section class="section">
        <h2>Choose a location</h2>
        <div class="grid club-grid" style="margin-top: 14px">
            <a class="card card-link" th:each="club : ${clubs}" th:href="@{/clubs/{slug}(slug=${club.slug})}">
                <span class="eyebrow" th:text="${club.city}">Cape Town</span>
                <h3 th:text="${club.name}">Halo</h3>
                <span class="meta" th:text="${club.address}">12 Loop Street</span>
            </a>
        </div>
    </section>
</main>
</body>
</html>
