<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${club.name} + ' Pictures | NightOut'">Pictures | NightOut</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">NightOut</a>
    <nav class="nav">
        <a th:href="@{/clubs/{slug}(slug=${club.slug})}">Dates</a>
        <a href="/login">Login</a>
    </nav>
</header>
<main class="shell">
    <section class="hero">
        <h1 th:text="${club.name}">HALO</h1>
        <p class="date-heading" th:text="${#temporals.format(nightDate, 'EEEE d MMMM')}">Friday 7 August</p>
    </section>

    <div th:if="${successMessage}" class="flash success" th:text="${successMessage}">Uploaded.</div>
    <div th:if="${errorMessage}" class="flash error" th:text="${errorMessage}">Upload unavailable.</div>

    <section class="section">
        <div class="upload-bar" th:if="${dateUploadAvailable}">
            <button class="button" type="button" data-upload-dialog-open>Upload</button>
        </div>
        <div class="gallery-actions" th:if="${!#lists.isEmpty(photos)}">
            <span class="selection-status" data-selection-count>0 selected</span>
            <div class="gallery-bulk-actions">
                <button class="button secondary" type="button" data-bulk-clear disabled>Clear</button>
                <button class="button" type="button" th:attr="data-bulk-download-url=@{/photos/download}" data-bulk-save disabled>Save Selected</button>
            </div>
        </div>
        <div class="gallery" th:if="${!#lists.isEmpty(photos)}">
            <div class="gallery-item" th:each="photo, stat : ${photos}">
                <button class="gallery-button" th:attr="data-gallery-src=@{/photos/{id}(id=${photo.id})},data-gallery-download=@{/photos/{id}/download(id=${photo.id})},data-gallery-share=@{/photos/{id}(id=${photo.id})},data-gallery-filename=${photo.safeFilename}" type="button">
                    <img th:src="@{/photos/{id}(id=${photo.id})}" th:alt="${photo.originalFilename}"
                         width="320" height="320" decoding="async"
                         th:attr="loading=${stat.index < 8 ? 'eager' : 'lazy'},fetchpriority=${stat.index < 4 ? 'high' : 'auto'}">
                </button>
                <label class="photo-select">
                    <input type="checkbox" th:value="${photo.id}" th:attr="data-save-url=@{/photos/{id}/download(id=${photo.id})},data-share-url=@{/photos/{id}(id=${photo.id})},data-save-filename=${photo.safeFilename}" data-photo-select>
                    <span>Select</span>
                </label>
                <a class="download-button gallery-download" th:href="@{/photos/{id}/download(id=${photo.id})}" th:attr="download=${photo.safeFilename},data-save-url=@{/photos/{id}/download(id=${photo.id})},data-share-url=@{/photos/{id}(id=${photo.id})},data-save-filename=${photo.safeFilename}" data-photo-save>Save</a>
            </div>
        </div>
    </section>

    <dialog class="upload-dialog" data-upload-dialog th:if="${dateUploadAvailable}">
        <div class="upload-dialog-panel">
            <div class="upload-dialog-head">
                <h2>Upload</h2>
                <button class="icon-button" type="button" data-upload-dialog-close aria-label="Close">&times;</button>
            </div>
            <form class="upload-choice-form" method="post" enctype="multipart/form-data" data-upload-form data-upload-choice-form
                  action="#" th:attr="action=@{/clubs/{slug}/dates/{date}/upload(slug=${club.slug},date=${nightDate})}"
                  th:data-upload-success-url="@{/clubs/{slug}/dates/{date}(slug=${club.slug},date=${nightDate})}"
                  th:data-upload-error-url="@{/clubs/{slug}/dates/{date}(slug=${club.slug},date=${nightDate})}"
                  th:data-upload-max-files="${maxUploadCount}"
                  th:data-upload-max-file-bytes="${maxUploadBytes}"
                  th:data-upload-max-batch-bytes="${maxUploadBatchBytes}">
                <input th:if="${#lists.size(uploadEvents) == 1}" type="hidden" name="eventId" th:value="${uploadEvents[0].event.id}">
                <label th:if="${#lists.size(uploadEvents) > 1}">
                    Choose Night
                    <select name="eventId">
                        <option th:each="item : ${uploadEvents}"
                                th:value="${item.event.id}"
                                th:text="${item.event.eventName}">Main floor</option>
                    </select>
                </label>
                <div class="upload-choice-actions">
                    <label class="button secondary upload-choice-button">
                        Take Photo
                        <input class="visually-hidden" data-photo-input data-auto-submit type="file" name="photos" accept="image/*" capture="environment">
                    </label>
                    <label class="button upload-choice-button">
                        Upload From Device
                        <input class="visually-hidden" data-photo-input data-auto-submit type="file" name="photos" accept="image/jpeg,image/png,image/webp" multiple>
                    </label>
                </div>
                <p class="meta" data-photo-summary>No photos selected</p>
                <button class="visually-hidden" data-upload-submit type="submit">Upload Photos</button>
            </form>
        </div>
    </dialog>
</main>
<div class="lightbox" data-lightbox aria-hidden="true">
    <button class="close" type="button" data-lightbox-close aria-label="Close">&times;</button>
    <a class="lightbox-download" href="#" download data-lightbox-download data-photo-save hidden>Save</a>
    <button class="prev" type="button" data-lightbox-prev aria-label="Previous">‹</button>
    <img data-lightbox-image alt="" decoding="async">
    <button class="next" type="button" data-lightbox-next aria-label="Next">›</button>
</div>
<script src="/js/gallery.js"></script>
<script src="/js/photo-save.js"></script>
<script src="/js/upload.js"></script>
</body>
</html>
