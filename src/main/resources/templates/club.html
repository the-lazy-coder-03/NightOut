<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${club.name} + ' | CrowdCam'">Club | CrowdCam</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">CrowdCam</a>
    <nav class="nav">
        <a href="/">Locations</a>
        <a href="/login">Login</a>
    </nav>
</header>
<main class="shell">
    <section class="hero">
        <h1 th:text="${club.name}">HALO</h1>
    </section>

    <section class="section">
        <h2>Choose a date</h2>
        <div class="grid date-grid" style="margin-top: 14px">
            <a class="card card-link date-card" th:each="nightDate : ${nightDates}" th:href="@{/clubs/{slug}/dates/{date}(slug=${club.slug},date=${nightDate.date})}">
                <span class="status" th:classappend="${nightDate.current ? 'active' : 'recent'}" th:text="${nightDate.current ? 'Current night' : 'Past night'}">Current night</span>
                <h3 th:text="${#temporals.format(nightDate.date, 'EEEE')}">Friday</h3>
                <span class="date-number" th:text="${#temporals.format(nightDate.date, 'd MMMM')}">7 August</span>
                <span class="meta" th:if="${nightDate.photoCount > 0}" th:text="${nightDate.photoCount} + ' photos'">143 photos</span>
            </a>
        </div>
    </section>
</main>
</body>
</html>
