<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Private Events | NightOut</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="private-events-page">
<header class="topbar">
    <a class="brand" href="/">NightOut</a>
    <nav class="nav">
        <a href="/dashboard">Dashboard</a>
        <form method="post" th:action="@{/logout}">
            <button type="submit">Log out</button>
        </form>
    </nav>
</header>
<main class="shell">
    <div th:if="${successMessage}" class="flash success" th:text="${successMessage}">Saved.</div>
    <div th:if="${errorMessage}" class="flash error" th:text="${errorMessage}">Could not save.</div>

    <section class="private-action-grid" aria-label="Private event actions">
        <a class="card card-link private-action-card" href="/private-events/create">
            <h2>Create private event</h2>
        </a>
        <a class="card card-link private-action-card" href="/private-events/join">
            <h2>Join private event</h2>
        </a>
    </section>

    <section class="section">
        <h2>Your private events</h2>
        <div th:if="${#lists.isEmpty(events)}" class="empty">No active private events yet.</div>
        <div class="grid club-grid" th:if="${!#lists.isEmpty(events)}">
            <a class="card card-link" th:each="item : ${events}" th:href="@{/private-events/{code}(code=${item.event.joinCode})}">
                <h3 th:text="${item.event.eventName}">Birthday</h3>
                <span class="meta" th:if="${item.creator || item.event.guestSharingAllowed}" th:text="|Code ${item.event.joinCode}|">Code 12345</span>
                <span class="meta" th:if="${(item.creator || item.event.guestSharingAllowed) && item.event.sharePassword != null}" th:text="|Password ${item.event.sharePassword}|">Password example-password</span>
                <span class="meta" th:text="|Expires ${#temporals.format(item.expiresOn, 'yyyy-MM-dd')}|">Expires 2026-09-13</span>
            </a>
        </div>
    </section>
</main>
</body>
</html>
