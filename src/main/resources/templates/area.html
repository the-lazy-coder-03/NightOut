<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${area.displayName} + ' | NightOut'">Area | NightOut</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">NightOut</a>
    <nav class="nav">
        <a href="/">Areas</a>
        <a href="/login">Login</a>
    </nav>
</header>
<main class="shell">
    <section class="hero">
        <h1 th:text="${area.displayName}">Cape Town</h1>
        <p>Choose a club to view dates, galleries, and uploads for that night.</p>
    </section>

    <section class="section">
        <h2>Clubs</h2>
        <div class="empty" th:if="${#lists.isEmpty(clubs)}">No clubs are live in this area yet.</div>
        <div class="grid club-grid area-club-grid" th:if="${!#lists.isEmpty(clubs)}">
            <a class="card card-link" th:each="club : ${clubs}" th:href="@{/clubs/{slug}(slug=${club.slug})}">
                <div class="club-card-media">
                    <img class="club-card-image" th:if="${club.hasUploadedImage()}" th:src="@{/club-images/{id}(id=${club.id})}" th:alt="${club.name}" width="640" height="400" loading="lazy" decoding="async">
                    <img class="club-card-image" th:if="${!club.hasUploadedImage() and club.logoUrl != null}" th:src="${club.logoUrl}" th:alt="${club.name}" width="640" height="400" loading="lazy" decoding="async">
                    <span class="club-card-placeholder" th:if="${!club.hasUploadedImage() and club.logoUrl == null}"></span>
                </div>
                <h3 th:text="${club.name}">HALO</h3>
            </a>
        </div>
    </section>
</main>
<div hidden aria-hidden="true">
    <span th:each="preload : ${photoPreloads}" th:data-preload-src="${preload.url}"></span>
</div>
<script src="/js/area-preload.js"></script>
</body>
</html>
