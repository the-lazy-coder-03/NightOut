<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${area.displayName} + ' | NightOut'">Area | NightOut</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">NightOut</a>
    <nav class="nav">
        <a href="/">Areas</a>
        <a href="/login">Club login</a>
    </nav>
</header>
<main class="shell">
    <section class="hero">
        <span class="eyebrow">Area</span>
        <h1 th:text="${area.displayName}">Cape Town</h1>
        <p>Choose a club to view dates, galleries, and uploads for that night.</p>
    </section>

    <section class="section">
        <h2>Clubs</h2>
        <div class="empty" th:if="${#lists.isEmpty(clubs)}">No clubs are live in this area yet.</div>
        <div class="grid club-grid" th:if="${!#lists.isEmpty(clubs)}">
            <a class="card card-link" th:each="club : ${clubs}" th:href="@{/clubs/{slug}(slug=${club.slug})}">
                <span class="eyebrow" th:text="${club.area}">Cape Town</span>
                <h3 th:text="${club.name}">Halo</h3>
                <span class="meta" th:text="${club.address}">12 Loop Street</span>
            </a>
        </div>
    </section>
</main>
</body>
</html>
