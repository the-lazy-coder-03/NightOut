<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${club.name} + ' Gallery | NightOut'">Gallery | NightOut</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">NightOut</a>
    <nav class="nav">
        <a th:href="@{/clubs/{slug}/events/{id}(slug=${club.slug},id=${eventView.event.id})}">Night</a>
        <a th:href="@{/clubs/{slug}/events/{id}/upload(slug=${club.slug},id=${eventView.event.id})}">Upload</a>
    </nav>
</header>
<main class="shell">
    <div th:if="${successMessage}" class="flash success" th:text="${successMessage}">Uploaded.</div>
    <section class="hero">
        <span class="eyebrow" th:text="${club.name}">HALO</span>
        <h1 th:text="${eventView.event.eventName}">Saturday</h1>
        <p th:text="${#temporals.format(eventView.event.eventDate, 'EEEE d MMMM') + ' | Photos available until ' + #temporals.format(eventView.expiresOn, 'd MMMM')}">Date</p>
    </section>

    <section class="section">
        <div th:if="${#lists.isEmpty(photos)}" class="empty">No photos have been uploaded for this night yet.</div>
        <div class="gallery-actions" th:if="${!#lists.isEmpty(photos)}">
            <span class="selection-status" data-selection-count>0 selected</span>
            <div class="gallery-bulk-actions">
                <button class="button secondary" type="button" data-bulk-clear disabled>Clear</button>
                <button class="button" type="button" th:attr="data-bulk-download-url=@{/photos/download}" data-bulk-save disabled>Save Selected</button>
            </div>
        </div>
        <div class="gallery" th:if="${!#lists.isEmpty(photos)}">
            <div class="gallery-item" th:each="photo, stat : ${photos}">
                <button class="gallery-button" th:attr="data-gallery-src=@{/photos/{id}(id=${photo.id})},data-gallery-download=@{/photos/{id}/download(id=${photo.id})},data-gallery-share=@{/photos/{id}(id=${photo.id})},data-gallery-filename=${photo.safeFilename}" type="button">
                    <img th:src="@{/photos/{id}(id=${photo.id})}" th:alt="${photo.originalFilename}"
                         width="320" height="320" decoding="async"
                         th:attr="loading=${stat.index < 8 ? 'eager' : 'lazy'},fetchpriority=${stat.index < 4 ? 'high' : 'auto'}">
                </button>
                <label class="photo-select">
                    <input type="checkbox" th:value="${photo.id}" th:attr="data-save-url=@{/photos/{id}/download(id=${photo.id})},data-share-url=@{/photos/{id}(id=${photo.id})},data-save-filename=${photo.safeFilename}" data-photo-select>
                    <span>Select</span>
                </label>
                <a class="download-button gallery-download" th:href="@{/photos/{id}/download(id=${photo.id})}" th:attr="download=${photo.safeFilename},data-save-url=@{/photos/{id}/download(id=${photo.id})},data-share-url=@{/photos/{id}(id=${photo.id})},data-save-filename=${photo.safeFilename}" data-photo-save>Save</a>
            </div>
        </div>
    </section>
</main>
<div class="lightbox" data-lightbox aria-hidden="true">
    <button class="close" type="button" data-lightbox-close aria-label="Close">&times;</button>
    <a class="lightbox-download" href="#" download data-lightbox-download data-photo-save hidden>Save</a>
    <button class="prev" type="button" data-lightbox-prev aria-label="Previous">‹</button>
    <img data-lightbox-image alt="" decoding="async">
    <button class="next" type="button" data-lightbox-next aria-label="Next">›</button>
</div>
<script src="/js/gallery.js"></script>
<script src="/js/photo-save.js"></script>
</body>
</html>
