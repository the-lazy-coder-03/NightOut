<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Night | NightOut</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/admin">NightOut Admin</a>
</header>
<main class="shell">
    <section class="hero">
        <span class="eyebrow" th:text="${event.club.name}">Club</span>
        <h1>Edit night</h1>
    </section>
    <form class="card form-grid two" method="post" th:action="@{/admin/events/{id}(id=${event.id})}">
        <label>Event name <input name="eventName" th:value="${event.eventName}" required></label>
        <label>Date <input name="eventDate" type="date" th:value="${event.eventDate}" required></label>
        <label>Start <input name="startTime" type="time" th:value="${event.startTime}" required></label>
        <label>End <input name="endTime" type="time" th:value="${event.endTime}" required></label>
        <label>Cancelled <input type="checkbox" name="cancelled" value="true" th:checked="${event.cancelled}"></label>
        <button class="button" type="submit">Save Night</button>
    </form>
</main>
</body>
</html>
