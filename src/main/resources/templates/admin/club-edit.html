<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Club | CrowdCam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="admin-page" data-bs-theme="dark">
<nav class="navbar admin-mobile-nav d-lg-none">
    <div class="container-fluid">
        <a class="admin-mobile-brand" href="/admin">CrowdCam Admin</a>
        <button class="navbar-toggler admin-menu-button" type="button" data-bs-toggle="offcanvas" data-bs-target="#adminSidebar" aria-controls="adminSidebar" aria-label="Open admin menu">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>
<aside class="admin-sidebar d-none d-lg-flex">
    <div class="admin-sidebar-inner">
        <a class="admin-sidebar-brand" href="/admin">CrowdCam Admin</a>
        <div class="admin-sidebar-section">
            <span class="admin-sidebar-label">Dashboard</span>
            <nav class="admin-sidebar-nav" aria-label="Admin sections">
                <a class="admin-nav-link" href="/admin" data-admin-section="create-club">Create Club</a>
                <a class="admin-nav-link" href="/admin" data-admin-section="clubs">Clubs</a>
                <a class="admin-nav-link" href="/admin" data-admin-section="create-night">Create Night</a>
                <a class="admin-nav-link" href="/admin" data-admin-section="nights">Nights</a>
                <a class="admin-nav-link" href="/admin" data-admin-section="owners">Owners</a>
                <a class="admin-nav-link" href="/admin" data-admin-section="photos">Photos</a>
            </nav>
        </div>
        <div class="admin-sidebar-footer">
            <a class="admin-nav-link" href="/owner">Owner View</a>
            <form class="admin-logout-form" method="post" th:action="@{/logout}">
                <button class="admin-nav-link admin-logout-button" type="submit">Log Out</button>
            </form>
        </div>
    </div>
</aside>
<div class="offcanvas offcanvas-start admin-offcanvas d-lg-none" tabindex="-1" id="adminSidebar" aria-labelledby="adminSidebarLabel">
    <div class="offcanvas-header">
        <a class="admin-sidebar-brand" id="adminSidebarLabel" href="/admin">CrowdCam Admin</a>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <nav class="admin-sidebar-nav" aria-label="Admin sections">
            <a class="admin-nav-link" href="/admin" data-admin-section="create-club" data-bs-dismiss="offcanvas">Create Club</a>
            <a class="admin-nav-link" href="/admin" data-admin-section="clubs" data-bs-dismiss="offcanvas">Clubs</a>
            <a class="admin-nav-link" href="/admin" data-admin-section="create-night" data-bs-dismiss="offcanvas">Create Night</a>
            <a class="admin-nav-link" href="/admin" data-admin-section="nights" data-bs-dismiss="offcanvas">Nights</a>
            <a class="admin-nav-link" href="/admin" data-admin-section="owners" data-bs-dismiss="offcanvas">Owners</a>
            <a class="admin-nav-link" href="/admin" data-admin-section="photos" data-bs-dismiss="offcanvas">Photos</a>
        </nav>
        <div class="admin-sidebar-footer">
            <a class="admin-nav-link" href="/owner" data-bs-dismiss="offcanvas">Owner View</a>
            <form class="admin-logout-form" method="post" th:action="@{/logout}">
                <button class="admin-nav-link admin-logout-button" type="submit">Log Out</button>
            </form>
        </div>
    </div>
</div>
<main class="shell admin-shell">
    <div th:if="${successMessage}" class="flash success" th:text="${successMessage}">Saved.</div>
    <div th:if="${errorMessage}" class="flash error" th:text="${errorMessage}">Could not save.</div>
    <section class="hero">
        <span class="eyebrow">Club</span>
        <h1 th:text="'Edit ' + ${club.name}">Edit club</h1>
    </section>
    <form class="card form-grid two" method="post" enctype="multipart/form-data" th:action="@{/admin/clubs/{id}(id=${club.id})}">
        <label>Name <input name="name" th:value="${club.name}" required></label>
        <label>Slug <input name="slug" th:value="${club.slug}" required></label>
        <label>City <input name="city" th:value="${club.city}" required></label>
        <label>Area
            <select name="area" required>
                <option th:each="area : ${areas}" th:value="${area.displayName}" th:text="${area.displayName}" th:selected="${area.displayName == club.area}">Cape Town</option>
            </select>
        </label>
        <label>Address <input name="address" th:value="${club.address}"></label>
        <div class="club-image-admin">
            <span>Current Image</span>
            <div class="club-card-media">
                <img class="club-card-image" th:if="${club.hasUploadedImage()}" th:src="@{/club-images/{id}(id=${club.id})}" th:alt="${club.name}" width="640" height="400" decoding="async">
                <img class="club-card-image" th:if="${!club.hasUploadedImage() and club.logoUrl != null}" th:src="${club.logoUrl}" th:alt="${club.name}" width="640" height="400" decoding="async">
                <span class="club-card-placeholder" th:if="${!club.hasUploadedImage() and club.logoUrl == null}"></span>
            </div>
        </div>
        <label>Club Image <input name="clubImage" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <label>Storage prefix <input name="storageFolderId" th:value="${club.storageFolderId}"></label>
        <label>Active <input type="checkbox" name="active" value="true" th:checked="${club.active}"></label>
        <button class="button" type="submit">Save Club</button>
    </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/js/admin-dashboard.js"></script>
</body>
</html>
