<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | CrowdCam</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">CrowdCam</a>
</header>
<main class="shell">
    <section class="hero">
        <span class="eyebrow">Managers</span>
        <h1>Login</h1>
    </section>
    <div th:if="${errorMessage != null}" class="flash error" th:text="${errorMessage}">Sign-in failed.</div>
    <div class="card form-grid">
        <a class="button" href="/oauth2/authorization/logto">Continue with Logto</a>
    </div>
</main>
</body>
</html>
