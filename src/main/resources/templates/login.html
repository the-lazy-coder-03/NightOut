<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Club Login | NightOut</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">NightOut</a>
</header>
<main class="shell">
    <section class="hero">
        <span class="eyebrow">Managers</span>
        <h1>Club login</h1>
    </section>
    <form class="card form-grid" method="post" th:action="@{/login}">
        <div th:if="${param.error}" class="flash error">Invalid email or password.</div>
        <label>Email <input type="email" name="username" autocomplete="email" required></label>
        <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
        <button class="button" type="submit">Log in</button>
    </form>
</main>
</body>
</html>
