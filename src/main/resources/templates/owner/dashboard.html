<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Owner | NightOut</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">NightOut Owner</a>
    <nav class="nav">
        <form method="post" th:action="@{/logout}">
            <button type="submit">Log out</button>
        </form>
    </nav>
</header>
<main class="shell">
    <section class="hero">
        <span class="eyebrow">Your clubs</span>
        <h1>Owner Dashboard</h1>
    </section>
    <div th:if="${#lists.isEmpty(clubs)}" class="empty">No clubs have been assigned to this account.</div>
    <div class="grid club-grid" th:if="${!#lists.isEmpty(clubs)}">
        <a class="card card-link" th:each="club : ${clubs}" th:href="@{/owner/clubs/{id}(id=${club.id})}">
            <span class="eyebrow" th:text="${club.city}">Cape Town</span>
            <h3 th:text="${club.name}">Halo</h3>
            <span class="meta">Manage nights, photos, and QR code</span>
        </a>
    </div>
</main>
</body>
</html>
