# Copy to /etc/nginx/sites-available/primepick.conf, then enable from sites-enabled.
#
# This assumes:
# - NightOut Spring Boot runs on 127.0.0.1:8080
# - 9Drive frontend container publishes 127.0.0.1:5173 or 0.0.0.0:5173
# - 9Drive backend container publishes 127.0.0.1:4000 or 0.0.0.0:4000
# - Let's Encrypt certs exist at the paths below.
#
# If /etc/letsencrypt/live/primepick.co.za does not exist yet, run:
# sudo certbot certonly --nginx -d primepick.co.za -d www.primepick.co.za

server {
    listen 80;
    listen [::]:80;
    server_name primepick.co.za www.primepick.co.za drive.primepick.co.za;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name primepick.co.za www.primepick.co.za;

    ssl_certificate /etc/letsencrypt/live/primepick.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primepick.co.za/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name drive.primepick.co.za;

    ssl_certificate /etc/letsencrypt/live/drive.primepick.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive.primepick.co.za/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5g;

    location ~ ^/(api|public|auth|api-keys|provider-configs|connected-accounts|storage|uploads|files|folders|invites|audit-logs|system)(/|$) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
