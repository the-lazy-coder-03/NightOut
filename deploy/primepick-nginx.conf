# Copy to /etc/nginx/sites-available/primepick.conf, then enable from sites-enabled.
#
# This assumes:
# - NightOut Spring Boot runs on 127.0.0.1:8090
# - rclone serve s3, if used, binds only to 127.0.0.1:8080 and is not proxied.
# - Let's Encrypt certs exist at the paths below.
#
# If /etc/letsencrypt/live/primepick.co.za does not exist yet, run:
# sudo certbot certonly --nginx -d primepick.co.za -d www.primepick.co.za

server {
    listen 80;
    listen [::]:80;
    server_name primepick.co.za www.primepick.co.za;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name primepick.co.za www.primepick.co.za;

    ssl_certificate /etc/letsencrypt/live/primepick.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primepick.co.za/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
    }
}
